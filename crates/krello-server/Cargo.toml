[package]
name = "krello-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Krello local server: REST + WebSocket + static frontend"

[[bin]]
name = "krello"
path = "src/main.rs"

[dependencies]
krello-core = { path = "../krello-core" }
krello-ai-helper = { path = "../krello-ai-helper" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = "0.5"
futures = "0.3"
include_dir = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"

[dev-dependencies]
http-body-util = "0.1"
