<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krello</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="boot">
      <div class="boot-logo"><img src="/favicon.svg" width="58" height="58" alt="Krello" style="display:block;border-radius:18px" /></div>
      <p id="boot-status">Chargement de Krello…</p>
    </div>
  </div>
  <div id="overlays"></div>
  <script>
    // Diagnostic de sécurité : affiche l'erreur si un script module échoue au chargement
    window.addEventListener('error', function(e) {
      var status = document.getElementById('boot-status');
      if (status) {
        status.innerHTML = '<span style="color:#ef4444">Erreur au démarrage : ' + (e.message || 'Erreur inattendue') + '</span>' +
          '<br><button onclick="location.reload()" style="margin-top:14px;padding:6px 14px;border-radius:8px;border:1px solid #3b82f6;background:#2563eb;color:#fff;cursor:pointer;font-weight:600;font-size:12px;">Recharger</button>';
      }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
